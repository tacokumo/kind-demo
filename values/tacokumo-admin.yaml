# Global configuration
global:
  externalServices:
    postgresql:
      host: "postgresql.tacokumo-admin.svc.cluster.local"
      port: 5432
      database: "tacokumo_admin_db"
      username: "admin_api"
      secretName: "tacokumo-admin-db-credentials"
      initialConnRetry: 5
    redis:
      host: "valkey.tacokumo-admin.svc.cluster.local"
      port: 6379
      db: 0
      secretName: "tacokumo-admin-valkey-credentials"
      initialConnRetry: 5

# GitHub OAuth configuration (moved to admin section to match chart structure)
# github:
#   oauth:
#     secretName: "tacokumo-admin-github-oauth"

admin:
  # Replica configuration
  replicaCount: 1

  # Image configuration
  image:
    repository: ghcr.io/tacokumo/admin
    tag: main-arm  # Keep arm tag for local development
    pullPolicy: IfNotPresent

  # Service configuration
  service:
    type: ClusterIP
    port: 80
    targetPort: 8080

  # ServiceAccount configuration
  serviceAccount:
    create: true
    name: "tacokumo-admin"
    annotations: {}

  # Application configuration
  config:
    server:
      addr: "0.0.0.0"
      port: "8080"
      baseDomain: "tacokumo.local"
      logLevel: "info"

    adminDb:
      host: ""  # Will be overridden by env var
      port: 5432
      user: ""  # Will be overridden by env var
      password: ""  # Will be overridden by env var
      dbName: ""  # Will be overridden by env var
      initialConnRetry: 10

    auth:
      clientId: ""  # Will be overridden by env var
      clientSecret: ""  # Will be overridden by env var
      callbackUrl: "http://admin.tacokumo.local/v1alpha1/auth/callback"
      frontendUrl: "http://admin.tacokumo.local"
      githubOrg: "tacokumo"  # Will be injected by helmfile
      sessionTtl: "24h"
      cookieSecure: false

    redis:
      host: ""  # Will be overridden by env var
      port: 6379
      password: ""  # Will be overridden by env var
      db: 0
      initialConnRetry: 10

    cors:
      allowOrigins: "http://admin.tacokumo.local"
      allowMethods: "GET, POST, PUT, DELETE, OPTIONS"
      allowHeaders: "Authorization, Content-Type"
      exposeHeaders: "Content-Type, Authorization"
      allowCredentials: true
      maxAge: 86400

    tls:
      enabled: false
      certFile: "/app/certs/server.crt"
      keyFile: "/app/certs/server.key"

    opentelemetry:
      enabled: false
      serviceName: "tacokumo-admin"
      tracesExporter: "otlp"
      otlpEndpoint: "http://otel-collector:4317"
      otlpProtocol: "grpc"

  # GitHub OAuth secrets
  github:
    oauth:
      secretName: "tacokumo-admin-github-oauth"

  # Pod configuration
  terminationGracePeriodSeconds: 30

  # Security context
  securityContext: {}
  podSecurityContext: {}

  # Health probes
  livenessProbe:
    httpGet:
      path: /healthz
      port: 8080
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  readinessProbe:
    httpGet:
      path: /readyz
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  # Resource configuration
  resources: {}
    # limits:
    #   cpu: 500m
    #   memory: 512Mi
    # requests:
    #   cpu: 250m
    #   memory: 256Mi

  # Node selection
  nodeSelector: {}
  tolerations: []
  affinity: {}

  # Pod labels and annotations
  podLabels: {}
  podAnnotations: {}

# Ingress configuration
ingress:
  enabled: true
  className: traefik  # Keep traefik for local development
  annotations: {}
  hosts:
    - host: admin.tacokumo.local
      paths:
        - path: /
          pathType: Prefix
  tls: []  # TLS disabled for local development

