apiVersion: batch/v1
kind: Job
metadata:
  name: admin-db-migration
  namespace: tacokumo-admin
  labels:
    app: admin-db-migration
spec:
  # Allow up to 3 retries on failure
  backoffLimit: 3
  # Timeout after 10 minutes
  activeDeadlineSeconds: 600
  # Clean up automatically after successful completion
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app: admin-db-migration
    spec:
      restartPolicy: Never
      initContainers:
      # Wait for PostgreSQL to be ready before running migration
      - name: wait-for-postgres
        image: postgres:18.0
        command:
          - /bin/sh
          - -c
          - |
            echo "Waiting for PostgreSQL to be ready..."
            until pg_isready -h postgresql.tacokumo-admin.svc.cluster.local -p 5432 -U postgres; do
              echo "PostgreSQL is not ready yet, waiting..."
              sleep 2
            done
            echo "PostgreSQL is ready!"

            # Additional connectivity test with database
            echo "Testing database connectivity..."
            PGPASSWORD=password psql -h postgresql.tacokumo-admin.svc.cluster.local -p 5432 -U postgres -d postgres -c "SELECT 1;" > /dev/null
            echo "Database connectivity confirmed!"
        env:
        - name: PGPASSWORD
          value: "password"
      containers:
      - name: migrate
        image: arigaio/atlas:latest
        args:
          - schema
          - apply
          - --url
          - postgres://admin_api:password@postgresql.tacokumo-admin.svc.cluster.local:5432/tacokumo_admin_db?sslmode=disable
          - --dev-url
          - postgres://postgres:password@postgresql.tacokumo-admin.svc.cluster.local:5432/postgres?sslmode=disable
          - --to
          - file:///schema.sql
          - --auto-approve
        env:
        - name: ADMIN_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: tacokumo-admin-db-credentials
              key: password
        volumeMounts:
        - name: schema
          mountPath: /schema.sql
          subPath: schema.sql
          readOnly: true
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
      volumes:
      - name: schema
        configMap:
          name: admin-db-schema